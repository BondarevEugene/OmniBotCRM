{% extends 'base.html' %}{% block title %}Вход{% endblock %}{% block content %}<div class="login-panel"><div class="brand big"><span class="mark">◈</span><span>OMNIFACTORY <small>COMMAND CENTER</small></span></div><div class="eyebrow">SECURE ACCESS</div><h1>Панель управления</h1><p class="muted">Единый центр управления клиентами, ботами и операциями.</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/login" class="form-stack"><input type="hidden" name="token" value="{{ csrf }}"><label>Email<input name="email" type="email" autocomplete="username" required autofocus></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary">Войти в систему <span>↗</span></button></form><div class="login-foot">Доступ только для уполномоченных сотрудников</div></div>{% endblock %}
