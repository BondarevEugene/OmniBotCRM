{% extends 'base.html' %}{% block title %}Новая сделка{% endblock %}{% block crumb %}ВОРОНКА / НОВАЯ СДЕЛКА{% endblock %}{% block content %}<div class="heading"><div><div class="eyebrow">NEW OPPORTUNITY</div><h1>Новая сделка<span class="gold">.</span></h1></div><a href="/pipeline" class="btn">← Воронка</a></div><section class="panel pad narrow"><form class="form-grid" method="post"><input type="hidden" name="token" value="{{ csrf }}"><label class="wide">Название<input name="title" placeholder="Корпоративный портал для компании" required></label><label>Воронка<select name="pipeline_id" required>{% for p in pipelines %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></label><label>Этап (выберите этап той же воронки)<select name="stage_id" required>{% for s in stages %}<option value="{{ s.id }}">{{ s.pipeline.name }} · {{ s.name }}</option>{% endfor %}</select></label><label>ID клиента<input name="customer_id" type="number"></label><label>ID компании<input name="company_id" type="number"></label><label>Услуга<select name="service">{% for key,name in services.items() %}<option value="{{ key }}">{{ name }}</option>{% endfor %}</select></label><label>Ожидаемый бюджет<input name="budget" type="number" min="0" step="0.01" value="0"></label><label>Валюта<input name="currency" value="UAH" maxlength="3"></label><label>Ожидаемая дата решения<input name="expected_close_at" type="date"></label><label class="wide">Описание запроса<textarea name="notes" rows="5"></textarea></label><button class="btn primary">Сохранить сделку</button></form></section>{% endblock %}
